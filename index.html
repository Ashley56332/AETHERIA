<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AETHERIA ONLINE v0.7</title><style>
*{box-sizing:border-box}body{margin:0;background:#081625;color:#eef7ff;font-family:system-ui,'Noto Sans Thai',sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}.panel{background:linear-gradient(145deg,#182b47f5,#10192ef5);border:1px solid #6c92b466;border-radius:17px;box-shadow:0 15px 50px #0008;padding:15px}button,select,input{font:inherit}button{background:linear-gradient(120deg,#345d95,#6e55bd);color:white;border:1px solid #a9c5ff66;border-radius:12px;padding:10px;cursor:pointer}button:active{transform:scale(.96)}input,select{background:#0b1930;color:white;border:1px solid #527396;border-radius:10px;padding:10px;width:100%}#login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#385e89,#071020 75%);z-index:20}#login .panel{width:min(92vw,400px);text-align:center}h1{font-size:27px;color:#e7d4a2;margin:0}small{color:#a7c0d7}#login input,#login select{margin-top:10px}#login button{width:100%;margin-top:12px}#hud{position:fixed;top:8px;left:8px;right:8px;display:none;pointer-events:none}#hud>*{pointer-events:auto}.top{display:flex;justify-content:space-between;gap:6px}.stats{padding:9px;background:#0b1a2ddc;border:1px solid #6c92b477;border-radius:12px;min-width:175px;font-size:12px}.bar{height:9px;background:#24384e;border-radius:8px;overflow:hidden;margin:4px 0}.bar span{display:block;height:100%;background:linear-gradient(90deg,#ef5d74,#ffac81);width:100%}#xpbar{background:linear-gradient(90deg,#68c5fa,#a18fff)}.coins{background:#0b1a2ddc;border-radius:12px;padding:10px;font-size:12px}#tools{position:fixed;top:85px;right:9px;display:none;gap:5px;flex-direction:column}#tools button{padding:9px;font-size:12px}#actions{position:fixed;bottom:18px;right:15px;display:none;gap:10px}#actions button{width:67px;height:67px;border-radius:50%;font-weight:bold;background:linear-gradient(140deg,#d17c3e,#813e7f)}#actions button:nth-child(2){background:linear-gradient(140deg,#4c9cda,#5346b2)}#stick{position:fixed;bottom:20px;left:18px;width:116px;height:116px;border:2px solid #b0d9ff88;border-radius:50%;background:#203e6077;display:none;touch-action:none}#nub{position:absolute;left:35px;top:35px;width:44px;height:44px;border-radius:50%;background:#b3d4ffbb}#modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:15}#modal .panel{width:min(92vw,450px);max-height:80dvh;overflow:auto}#modal h2{margin:0 0 12px}#modal button{margin:5px}#chat{position:fixed;bottom:145px;left:10px;width:min(290px,55vw);display:none}#messages{max-height:100px;overflow:auto;font-size:11px;text-shadow:1px 1px #000;background:#07172799;border-radius:9px;padding:6px}#chatrow{display:flex}#chatrow input{font-size:12px;padding:6px}#chatrow button{padding:6px}#toast{position:fixed;top:28%;left:50%;transform:translateX(-50%);background:#101b35ec;border:1px solid #e1c384;border-radius:12px;padding:12px;display:none;z-index:30;text-align:center}#offline{display:block;margin-top:10px;color:#b5d9f7}@media(max-width:600px){#tools{top:92px}#tools button{font-size:11px;padding:7px}#actions button{width:59px;height:59px}#chat{bottom:145px}}
</style></head><body><canvas id="game"></canvas><div id="login"><div class="panel"><h1>✦ AETHERIA ONLINE ✦</h1><p>REALM OF LEGENDS · v0.7 BETA</p><input id="name" placeholder="ชื่อตัวละคร (2 ตัวขึ้นไป)" maxlength="24"><select id="job"><option value="warrior">⚔️ นักดาบ</option><option value="mage">🔮 นักเวท</option><option value="archer">🏹 นักธนู</option><option value="rogue">🗡️ นักฆ่า</option></select><button id="start">เข้าสู่โลกออนไลน์</button><small id="status">กำลังเชื่อมต่อเซิร์ฟเวอร์...</small><a id="offline" href="offline.html">เล่นเวอร์ชันออฟไลน์ v0.6</a></div></div><div id="hud"><div class="top"><div class="stats"><b id="who">Adventurer</b><span id="level"></span><div class="bar"><span id="hpbar"></span></div><div class="bar"><span id="xpbar"></span></div><span id="hptext"></span></div><div class="coins" id="currency"></div></div></div><div id="tools"><button onclick="showPanel('map')">🗺 แผนที่</button><button onclick="showPanel('gacha')">✨ กาชา</button><button onclick="showPanel('forge')">⚒ ตีบวก</button><button onclick="showPanel('fashion')">👘 แฟชั่น</button><button onclick="showPanel('help')">📜 วิธีเล่น</button></div><div id="stick"><div id="nub"></div></div><div id="actions"><button id="atk">⚔️<br>โจมตี</button><button id="skill">✨<br>สกิล</button><button id="heal">💚<br>ยา</button></div><div id="chat"><div id="messages"></div><div id="chatrow"><input id="msg" maxlength="120" placeholder="แชทกับผู้เล่น..."><button id="send">ส่ง</button></div></div><div id="modal"><div class="panel"><button style="float:right" onclick="closePanel()">✕</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div><div id="toast"></div><script src="/socket.io/socket.io.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),socket=io({autoConnect:true});let id=null,world={w:2800,h:2000},players={},mobs={},stats={},fx=[],keys={},stick={x:0,y:0},time=0,connected=false;const jobs={warrior:'นักดาบ',mage:'นักเวท',archer:'นักธนู',rogue:'นักฆ่า'};const colors=['#9fe1ff','#ec9ed7','#e6ba83'];function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',2300)}function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();socket.on('connect',()=>{$('status').textContent='เชื่อมต่อแล้ว พร้อมเข้าสู่เกม';connected=true});socket.on('disconnect',()=>{connected=false;toast('การเชื่อมต่อขาดหาย กำลังเชื่อมใหม่');$('status').textContent='เซิร์ฟเวอร์ขาดการเชื่อมต่อ';if(id){id=null;$('login').style.display='grid';['hud','tools','stick','actions','chat'].forEach(k=>$(k).style.display='none')}});$('start').onclick=()=>{if(!connected)return toast('รอเซิร์ฟเวอร์เชื่อมต่อ');let name=$('name').value.trim();socket.emit('join',{name,job:$('job').value,token:localStorage.getItem('aetheria-token')},r=>{if(r?.error)toast(r.error)})};socket.on('welcome',d=>{id=d.id;world=d.world;players=Object.fromEntries(d.players.map(p=>[p.id,p]));mobs=Object.fromEntries(d.mobs.map(m=>[m.id,m]));stats=d.stats;localStorage.setItem('aetheria-token',d.token);$('login').style.display='none';['hud','tools','stick','actions','chat'].forEach(k=>$(k).style.display=k==='tools'?'flex':'block');$('actions').style.display='flex';renderStats();toast('ยินดีต้อนรับสู่ AETHERIA!')});socket.on('playerJoin',p=>players[p.id]=p);socket.on('playerLeave',pid=>delete players[pid]);socket.on('playerMove',p=>{if(players[p.id])Object.assign(players[p.id],p)});socket.on('mobHit',d=>{if(mobs[d.id]){mobs[d.id].hp=d.hp;mobs[d.id].alive=d.hp>0;fx.push({x:mobs[d.id].x,y:mobs[d.id].y,t:Date.now(),text:'-'+Math.round(d.damage),color:'#ffe6a0'})}});socket.on('mobRespawn',m=>mobs[m.id]=m);socket.on('attackFx',e=>fx.push({...e,t:Date.now()}));socket.on('stats',d=>{stats=d;renderStats()});socket.on('notice',toast);socket.on('gachaResult',d=>{showPanel('result',d)});socket.on('chat',d=>{let el=document.createElement('div');el.textContent=d.name+': '+d.text;$('messages').append(el);while($('messages').children.length>30)$('messages').firstChild.remove();$('messages').scrollTop=9999});function renderStats(){let p=players[id];$('who').textContent=(p?.name||'นักผจญภัย')+' · '+jobs[stats.job];$('level').textContent=' Lv.'+stats.level;$('hpbar').style.width=(100*(stats.hp||0)/(stats.maxHp||1))+'%';$('xpbar').style.width=(100*stats.xp/(stats.level*65))+'%';$('hptext').textContent='HP '+stats.hp+'/'+stats.maxHp+' · EXP '+stats.xp+'/'+stats.level*65;$('currency').textContent='🪙 '+stats.gold+'  💎 '+stats.gems+'  🪨 '+stats.stones}window.closePanel=()=>$('modal').style.display='none';window.showPanel=(kind,data)=>{let title='',html='';if(kind==='gacha'){title='✨ ศาลาอัญเชิญ';html='<p>สุ่มแฟชั่น 50 💎 ต่อครั้ง · SSR 5% · การันตีทุก 20 ครั้ง</p><p>จำนวนครั้งก่อนการันตี: '+(20-stats.pity)+'</p><button id="roll">อัญเชิญ 1 ครั้ง (50 💎)</button>'}if(kind==='result'){title='🌟 ผลการอัญเชิญ';html='<div style="font-size:30px;text-align:center;padding:20px;color:#f9df9c">'+(data.rare?'✨ SSR ✨':'✦ R / SR ✦')+'<p>'+data.item+'</p></div>'}if(kind==='forge'){title='⚒ โรงตีเหล็ก';html='<p>อาวุธปัจจุบัน: +'+stats.weapon+' / +15</p><p>ค่าใช้จ่าย '+(50+stats.weapon*35)+' 🪙 และหิน 1 🪨</p><button id="upgrade">ตีบวกอาวุธ</button>'}if(kind==='fashion'){title='👘 ตู้แฟชั่น';html='<p>ชุดที่สวม: '+stats.skin+'</p>'+(stats.inventory.length?stats.inventory.map((x,i)=>'<button data-equip="'+i+'">'+x+'</button>').join(''):'ยังไม่มีแฟชั่น ลองสุ่มกาชา')}if(kind==='map'){title='🗺 โลก AETHERIA';html='<p>แผนที่ 2,800 × 2,000 หน่วย</p><p>🟩 ทุ่งหญ้า · 🌲 ป่า · 🏘 หมู่บ้านกลาง · 🪨 เขตภูเขา</p><p>มอนสเตอร์ 45 ตัว: สไลม์ หมาป่า โกเลม</p><p>เดินสำรวจด้วยจอยเสมือน หรือ WASD</p>'}if(kind==='help'){title='📜 คู่มือนักผจญภัย';html='<p>โจมตีมอนสเตอร์เพื่อรับ EXP เงินและหินตีบวก</p><p>กดสกิลโจมตีรอบตัว ใช้ยา 25 เหรียญเพื่อฟื้น HP</p><p>ข้อมูลตัวละครบันทึกบนเซิร์ฟเวอร์ (โฮสต์ต้องมีดิสก์ถาวร)</p><p>เปิดลิงก์เดียวกันบนมือถือเพื่อนเพื่อเจอกันในโลกเดียวกัน</p><p><a href="offline.html" style="color:#a8dfff">เล่นโหมดออฟไลน์ v0.6</a></p>'}$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').style.display='grid';$('roll')?.addEventListener('click',()=>socket.emit('gacha'));$('upgrade')?.addEventListener('click',()=>{socket.emit('upgrade');setTimeout(()=>showPanel('forge'),200)});document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{socket.emit('equip',Number(b.dataset.equip));closePanel()})};$('atk').onclick=()=>socket.emit('attack');$('skill').onclick=()=>socket.emit('skill');$('heal').onclick=()=>socket.emit('heal');$('send').onclick=()=>{socket.emit('chat',$('msg').value);$('msg').value=''};$('msg').onkeydown=e=>{if(e.key==='Enter')$('send').click()};addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement.tagName))return;keys[e.key.toLowerCase()]=true;if(e.key===' ')socket.emit('attack');if(e.key==='Shift')socket.emit('skill')});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);const pad=$('stick'),nub=$('nub');function padMove(e){let r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+58),dy=e.clientY-(r.top+58),m=Math.max(1,Math.hypot(dx,dy)/37);stick.x=dx/m/37;stick.y=dy/m/37;nub.style.transform='translate('+(stick.x*37)+'px,'+(stick.y*37)+'px)'}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);padMove(e)});pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture(e.pointerId))padMove(e)});function resetPad(){stick={x:0,y:0};nub.style.transform=''}pad.addEventListener('pointerup',resetPad);pad.addEventListener('pointercancel',resetPad);setInterval(()=>{if(!id||!connected)return;let dx=stick.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=stick.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy)socket.emit('move',{dx,dy})},50);
function draw(){requestAnimationFrame(draw);let w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#1d493d';ctx.fillRect(0,0,w,h);if(!id||!players[id])return;let p=players[id],camX=p.x-w/2,camY=p.y-h/2;ctx.save();ctx.translate(-camX,-camY);ctx.fillStyle='#346d51';ctx.fillRect(0,0,world.w,world.h);ctx.fillStyle='#b3aa77';ctx.fillRect(world.w/2-250,0,500,world.h);ctx.fillRect(0,world.h/2-160,world.w,320);ctx.fillStyle='#5c9ac3';ctx.fillRect(150,125,430,330);ctx.fillStyle='#2c6344';for(let x=70;x<world.w;x+=130)for(let y=80;y<world.h;y+=130){let hash=(x*13+y*7)%11;if(hash<4){ctx.fillStyle='#214e39';ctx.beginPath();ctx.arc(x+hash*8,y,26+hash*3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#44835b';ctx.beginPath();ctx.arc(x+hash*8-6,y-8,19+hash*2,0,Math.PI*2);ctx.fill()}}for(let m of Object.values(mobs)){if(!m.alive||Math.abs(m.x-p.x)>w/2+80||Math.abs(m.y-p.y)>h/2+80)continue;ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(m.x,m.y+17,22,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=colors[m.type];ctx.beginPath();ctx.ellipse(m.x,m.y+Math.sin(time/320+m.x)*3,21,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#15263c';ctx.fillRect(m.x-8,m.y-2,4,5);ctx.fillRect(m.x+5,m.y-2,4,5);ctx.fillStyle='#2d3342';ctx.fillRect(m.x-21,m.y-27,42,5);ctx.fillStyle='#e75f6e';ctx.fillRect(m.x-21,m.y-27,42*m.hp/m.maxHp,5)}for(let q of Object.values(players)){ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(q.x,q.y+21,18,7,0,0,7);ctx.fill();ctx.fillStyle=q.job==='mage'?'#ac86ec':q.job==='archer'?'#7bd8a2':q.job==='rogue'?'#b7a9d8':'#e7b57c';ctx.fillRect(q.x-12,q.y-7,24,29);ctx.fillStyle='#f4c5a0';ctx.beginPath();ctx.arc(q.x,q.y-17,12,0,7);ctx.fill();ctx.fillStyle='#29374d';ctx.fillRect(q.x-12,q.y-28,24,7);ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.strokeStyle='#172439';ctx.lineWidth=3;ctx.strokeText(q.name,q.x,q.y-40);ctx.fillText(q.name,q.x,q.y-40);if(q.skin!=='พื้นฐาน'){ctx.fillStyle='#f8dc96';ctx.fillText('✦',q.x+19,q.y-14)}}fx=fx.filter(f=>Date.now()-f.t<550);for(let f of fx){let a=(Date.now()-f.t)/550;if(f.text){ctx.fillStyle=f.color;ctx.font='bold 20px system-ui';ctx.fillText(f.text,f.x,f.y-25-a*40)}else{ctx.strokeStyle=f.skill?'#9fd7ff':'#ffe5a0';ctx.lineWidth=5*(1-a);ctx.beginPath();ctx.arc(f.x,f.y,(f.skill?150:85)*a,0,Math.PI*2);ctx.stroke()}}ctx.restore();ctx.fillStyle='#ffffffb0';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('AETHERIA ONLINE · '+Object.keys(players).length+' players',w/2,18);time+=16}draw();})();
</script></body></html>
