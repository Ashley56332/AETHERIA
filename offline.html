ass="intro" id="intro"><div class="window"><div class="big">✧ ⚔ ✧</div><h1>AETHERIA</h1><div class="muted">RISE OF LEGENDS • OFFLINE v0.6</div><p>แผนที่ขนาดใหญ่ • NPC 9 คน • มอนสเตอร์ 54 ตัว • กาชาจริง • ตีบวก • แฟชั่น • บอสแยกฉาก</p><button class="primary" id="start">เริ่มการผจญภัย</button><p class="sub">เล่นออฟไลน์บน Android • บันทึกในเครื่อง</p></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let W=0,H=0,scale=1;function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;scale=devicePixelRatio}addEventListener('resize',resize);resize();const fresh={level:1,x:300,y:280,hp:100,mp:60,xp:0,gold:180,gems:120,stones:8,potions:5,kills:0,plus:0,armor:0,pity:0,wardrobe:['นักผจญภัย'],outfit:'นักผจญภัย',pets:[],quest:0};let p;try{p={...fresh,...JSON.parse(localStorage.getItem('aetheria-v05')||'{}')}}catch{p={...fresh}}let scene='field',bossHP=0,bossMax=650,enemyHit=0,slash=0,flash=0,dir=0,keys={},move={x:0,y:0},tick=0,particles=[],mobs=[],loot=[],modal='',lastAttack=0,lastSkill=0,bossAttack=0,saveClock=0;const WORLD_W=3600,WORLD_H=2600;const npcs=[{x:320,y:300,name:'ลูน่า',role:'ผู้ให้เควสต์',icon:'📜',menu:'quest'},{x:460,y:310,name:'โบริน',role:'ช่างตีเหล็ก',icon:'⚒',menu:'forge'},{x:570,y:390,name:'เซเลน่า',role:'ผู้อัญเชิญ',icon:'🔮',menu:'gacha'},{x:380,y:450,name:'มีร่า',role:'ร้านขายยา',icon:'🧪',menu:'bag'},{x:720,y:370,name:'อาเรีย',role:'นักออกแบบแฟชั่น',icon:'👘',menu:'fashion'},{x:1700,y:900,name:'ผู้เฝ้าประตู',role:'ประตูมังกร',icon:'🐉',menu:'boss'},{x:2650,y:1750,name:'เอรอน',role:'นักสำรวจ',icon:'🧭',menu:'quest'},{x:1030,y:1900,name:'ไอริส',role:'ผู้ดูแลป่า',icon:'🌿',menu:'quest'},{x:3050,y:530,name:'เคน',role:'นักล่า',icon:'🏹',menu:'quest'}];const classes=['นักผจญภัย','ชุดจอมเวทดารา','ชุดอัศวินแสง','ชุดนักฆ่ารัตติกาล','ชุดเจ้าหญิงจันทรา','ปีกเทพอรุณ','ชุดจักรพรรดิมังกร'];const rare=['R','SR','SSR'];function save(){try{localStorage.setItem('aetheria-v05',JSON.stringify(p))}catch{}}function notify(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>t.classList.remove('show'),2200)}function rnd(a,b){return a+Math.random()*(b-a)}function spawn(){mobs=Array.from({length:54},(_,i)=>({x:rnd(150,WORLD_W-150),y:rnd(150,WORLD_H-150),hp:45+Math.floor(p.level*8),max:45+Math.floor(p.level*8),type:i%6,alive:true,respawn:0}));loot=Array.from({length:46},()=>({x:rnd(100,WORLD_W-100),y:rnd(100,WORLD_H-100),taken:false}))}spawn();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function xpAdd(v){p.xp+=v;while(p.xp>=p.level*70){p.xp-=p.level*70;p.level++;p.hp=100+p.level*12;p.mp=60+p.level*6;notify('✨ เลเวลอัป! Lv.'+p.level)}}function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-4,4),vy:rnd(-5,2),life:rnd(20,45),color})}function attack(skill=false){let now=performance.now();if(now-(skill?lastSkill:lastAttack)<(skill?1100:320))return;if(skill){if(p.mp<12)return notify('มานาไม่พอ');p.mp-=12;lastSkill=now}else lastAttack=now;slash=skill?22:13;flash=5;let reach=skill?165:95;let damage=(skill?40:17)+p.level*4+p.plus*6;let targets=scene==='boss'?[{x:800,y:480,hp:bossHP,boss:true}]:mobs.filter(m=>m.alive);for(let m of targets){if(Math.hypot(m.x-p.x,m.y-p.y)<reach){if(m.boss){bossHP=Math.max(0,bossHP-damage);burst(m.x,m.y,'#ffb86b',18);if(bossHP===0){p.gold+=350;p.gems+=60;p.stones+=5;xpAdd(120);notify('🏆 ชนะบอส! +350G +60💎 +5หิน');setTimeout(()=>leaveBoss(),1200)}}else{m.hp-=damage;burst(m.x,m.y,'#ff8ca5');if(m.hp<=0){m.alive=false;m.respawn=performance.now()+8000;p.kills++;p.gold+=12;p.gems+=p.kills%4===0?3:0;xpAdd(20);if(p.kills%3===0)p.stones++;notify('⚔ กำจัดมอนสเตอร์ +12G +20EXP')}}}}save()}
function collect(){if(scene==='field'){let npc=npcs.find(n=>Math.hypot(n.x-p.x,n.y-p.y)<100);if(npc){notify(npc.icon+' '+npc.name+' • '+npc.role);open(npc.menu);return}}if(scene==='boss')return notify('กำจัดบอสก่อน!');let item=loot.find(l=>!l.taken&&Math.hypot(l.x-p.x,l.y-p.y)<85);if(item){item.taken=true;p.gold+=15;p.stones++;if(Math.random()<.4)p.gems+=5;burst(item.x,item.y,'#ffe4a1');notify('📦 ได้รับ 15G และหินตีบวก');save()}else notify('เข้าใกล้หีบหรือ NPC เพื่อพูดคุย')}function potion(){if(p.potions<=0)return notify('ยาหมด! ซื้อได้ในกระเป๋า');if(p.hp>=100+p.level*12)return notify('HP เต็มแล้ว');p.potions--;p.hp=Math.min(100+p.level*12,p.hp+65);notify('🧪 ฟื้นฟู HP +65');save()}
function enterBoss(){if(scene==='boss')return;scene='boss';p.x=240;p.y=480;bossHP=bossMax=580+p.level*60;$('bossbar').style.display='block';close();notify('🐉 เข้าสู่ลานประลองมังกร!');save()}function leaveBoss(){scene='field';p.x=300;p.y=280;$('bossbar').style.display='none';close();notify('🌿 กลับสู่ป่าแห่งรุ่งอรุณ');save()}
function drawPlayer(x,y){ctx.save();ctx.translate(x,y);ctx.shadowColor=p.outfit==='นักผจญภัย'?'#a9ddff':'#e4b4ff';ctx.shadowBlur=18;ctx.fillStyle='#18223b';ctx.beginPath();ctx.ellipse(0,19,23,9,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=p.outfit.includes('มังกร')?'#c94f5c':p.outfit.includes('จอมเวท')?'#8c70df':p.outfit.includes('นักฆ่า')?'#424866':p.outfit.includes('อัศวิน')?'#d2c18c':'#568ac5';ctx.beginPath();ctx.moveTo(-16,-6);ctx.lineTo(17,-6);ctx.lineTo(22,28);ctx.lineTo(-22,28);ctx.fill();ctx.fillStyle='#f4c5a8';ctx.beginPath();ctx.arc(0,-20,17,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.outfit.includes('จันทรา')?'#e9ddff':'#343454';ctx.beginPath();ctx.arc(0,-27,18,Math.PI,Math.PI*2);ctx.lineTo(16,-23);ctx.lineTo(-15,-22);ctx.fill();ctx.fillStyle='#27324a';ctx.fillRect(-7,-20,4,3);ctx.fillRect(5,-20,4,3);ctx.strokeStyle='#ffebae';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(15,1);ctx.lineTo(29,-25);ctx.stroke();if(slash){ctx.strokeStyle=slash>14?'#9af5ff':'#ffe8b4';ctx.lineWidth=slash>14?12:7;ctx.beginPath();ctx.arc(0,0,slash>14?90:60,-1.35+dir,1.2+dir);ctx.stroke()}ctx.restore()}
function background(){let camX=p.x-innerWidth/2,camY=p.y-innerHeight/2;ctx.save();ctx.translate(-camX,-camY);ctx.fillStyle=scene==='boss'?'#312238':'#244c48';ctx.fillRect(camX,camY,innerWidth,innerHeight);if(scene==='field'){for(let i=0;i<470;i++){let x=(i*239+101)%WORLD_W,y=(i*367+83)%WORLD_H;ctx.fillStyle=i%4===0?'#4c8a70':'#376d61';ctx.beginPath();ctx.arc(x,y,20+i%4*5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1b4d4b';ctx.fillRect(x-3,y+10,6,20)}ctx.fillStyle='#ae9d75';ctx.fillRect(0,500,WORLD_W,85);ctx.fillRect(1100,0,85,WORLD_H);ctx.fillRect(2400,300,75,2100);ctx.fillStyle='#347a93';ctx.fillRect(2850,1250,750,470);ctx.fillStyle='#c7ac76';ctx.fillRect(0,0,850,600);ctx.fillStyle='#a6d2b0';ctx.fillRect(880,1500,700,480);ctx.fillStyle='#526d8b';ctx.fillRect(2350,0,1250,720);ctx.fillStyle='#d2bc91';for(let i=0;i<11;i++){let x=80+(i%4)*175,y=65+Math.floor(i/4)*165;ctx.fillRect(x,y,100,70);ctx.fillStyle='#975e65';ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+50,y-40);ctx.lineTo(x+112,y);ctx.fill();ctx.fillStyle='#d2bc91'}for(let n of npcs){ctx.fillStyle='#3a295b';ctx.beginPath();ctx.arc(n.x,n.y,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f1cfac';ctx.beginPath();ctx.arc(n.x,n.y-19,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff3c5';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(n.icon+' '+n.name,n.x,n.y-43);ctx.fillStyle='#b4dcff';ctx.font='11px system-ui';ctx.fillText(n.role,n.x,n.y-30)}for(let l of loot)if(!l.taken){ctx.fillStyle='#b78a46';ctx.fillRect(l.x-12,l.y-10,24,20);ctx.fillStyle='#ffe59e';ctx.fillRect(l.x-9,l.y-8,18,5)}for(let m of mobs)if(m.alive){ctx.fillStyle=['#80d8a6','#a69cfc','#e79ba6','#f3d17a','#8bc4e9','#c18ae9'][m.type];ctx.beginPath();ctx.ellipse(m.x,m.y,24,19,0,Math.PI,0);ctx.lineTo(m.x+24,m.y+6);ctx.lineTo(m.x-24,m.y+6);ctx.closePath();ctx.fill();ctx.fillStyle='#203046';if(m.type===3){ctx.fillRect(m.x-19,m.y-27,8,18);ctx.fillRect(m.x+11,m.y-27,8,18)}if(m.type===4){ctx.beginPath();ctx.moveTo(m.x-22,m.y);ctx.lineTo(m.x-35,m.y-15); if(modal==='map')html=`<div class="summon"><div class="big">🗺️ 🧭</div><p>โลก 3600 × 2600 • NPC ${npcs.length} คน • มอนสเตอร์ ${mobs.length} ตัว</p><p>ตำแหน่ง X:${Math.round(p.x)} Y:${Math.round(p.y)}</p></div><div class="grid">${[['เมืองเริ่มต้น','town'],['ทะเลสาบ','lake'],['ป่าลึก','forest'],['ประตูดันเจี้ยน','gate']].map(([name,id])=>`<div class="tile">${name}${action('เดินทาง','travel'+id)}</div>`).join('')}</div>`;
$('winBody').innerHTML=html;
};
const originalCollect=collect;collect=function(){originalCollect()};
const originalAttack=attack;attack=function(skill=false){originalAttack(skill);if(p.skills[0])slash+=p.skills[0]*2};
const originalUpdate=update;update=function(dt){originalUpdate(dt);if(p.mount&&scene==='field'&&!modal){ /* mount is visual and adds speed via position interpolation */ } };
const originalDraw=drawPlayer;drawPlayer=function(x,y){if(p.mount){ctx.save();ctx.font='26px sans-serif';ctx.textAlign='center';ctx.fillText('🐺',x,y+20);ctx.restore()}originalDraw(x,y)};
const bar=document.createElement('div');bar.id='expansionBar';bar.innerHTML=`<button data-open="journal">📒 บันทึก</button><button data-open="map">🗺️ โลก</button><button data-open="dungeon">🌀 ดันเจี้ยน</button><button data-open="craft">⚗️ คราฟต์</button><button data-open="talents">🌟 สกิล</button><button data-open="pets">🐾 คู่หู</button><button data-open="housing">🏠 บ้าน</button><button data-open="story">📖 เรื่องราว</button><button data-open="fishing">🎣 ปลา</button><button data-open="arena">🏟️ PvE</button>`;document.body.appendChild(bar);bar.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.open)));
let busy=false;const pause=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
$('winBody').addEventListener('click',async e=>{const b=e.target.closest('[data-extra]');if(!b||busy)return;const a=b.dataset.extra;const need=(condition,message)=>{if(!condition){notify(message);return false}return true};const spend=(gold)=>{if(!need(p.gold>=gold,'เงินไม่พอ'))return false;p.gold-=gold;return true};
if(a==='wood'||a==='mine'||a==='herb'||a==='fish'){busy=true;b.disabled=true;b.textContent='กำลังทำกิจกรรม...';await pause(a==='fish'?1800:700);p[{wood:'wood',mine:'ore',herb:'herbs',fish:'fish'}[a]]++;if(a==='wood')p.seeds+=Math.random()<.35?1:0;notify('ได้รับทรัพยากรแล้ว');busy=false}
else if(a==='cook'){if(!need(p.fish>=2,'ต้องมีปลา 2 ตัว'))return;p.fish-=2;p.food++;notify('ปรุงอาหารสำเร็จ')}
else if(a==='eat'){if(!need(p.food>0,'ไม่มีอาหาร'))return;p.food--;p.hp=Math.min(100+p.level*12,p.hp+45);notify('ฟื้น HP +45')}
else if(a==='house'){if(!need(p.wood>=5&&p.ore>=3,'ต้องใช้ไม้ 5 และแร่ 3'))return;p.wood-=5;p.ore-=3;p.house++;notify('อัปเกรดบ้านสำเร็จ')}
else if(a==='plant'){if(!need(p.seeds>0,'ไม่มีเมล็ด'))return;p.seeds--;p.crops++;notify('ปลูกพืชแล้ว')}
else if(a==='harvest'){if(!need(p.crops>0,'ยังไม่มีพืช'))return;p.crops--;p.herbs+=2;p.seeds++;notify('เก็บสมุนไพร +2 และเมล็ด +1')}
else if(a==='stone'){if(!need(p.wood>=2&&p.ore>=3,'วัตถุดิบไม่พอ'))return;p.wood-=2;p.ore-=3;p.stones+=2;p.crafts++;notify('คราฟต์หินตีบวก +2')}
else if(a==='brew'){if(!need(p.herbs>=3,'สมุนไพรไม่พอ'))return;p.herbs-=3;p.potions+=2;p.crafts++;notify('ปรุงยา +2')}
else if(a.startsWith('talent')){const i=Number(a.slice(-1));if(!need(p.skills.reduce((s,v)=>s+v,0)<p.level-1,'แต้มสกิลไม่พอ'))return;p.skills[i]++;notify('อัปสกิลสำเร็จ')}
else if(a==='element'){const es=['ไฟ','น้ำ','ลม','ดิน','แสง','มืด'];p.elements=es[(es.indexOf(p.elements)+1)%es.length];notify('เปลี่ยนธาตุ '+p.elements)}
else if(a==='dungeonFight'){if(!need(p.level>=2,'ต้องมีเลเวล 2'))return;if(!p.dungeonFloor)p.dungeonFloor=1;const floor=p.dungeonFloor,damage=14+floor*8;if(!need(p.hp>damage,'HP ไม่พอ โปรดใช้ยา'))return;p.hp-=damage;const win=Math.random()<(0.77+Math.min(.18,p.plus*.015));if(win){p.gold+=floor*55;p.gems+=floor*7;xpAdd(floor*18);p.ore+=floor;if(floor===5){p.dungeonWins++;p.dungeonFloor=0;p.stones+=5;notify('🏆 พิชิตดันเจี้ยนครบ 5 ชั้น!')}else{p.dungeonFloor++;notify('ชนะ! เปิดทางสู่ชั้น '+p.dungeonFloor)}}else notify('แพ้การต่อสู้ชั้น '+floor+' ลองเพิ่มเลเวลและอุปกรณ์')}
else if(a==='dungeonExit'){p.dungeonFloor=0;notify('ออกจากดันเจี้ยน')}
else if(a==='petTrain'){if(!need(p.pets.length>0,'ต้องมีสัตว์เลี้ยงจากกาชาก่อน')||!spend(50))return;p.petLevel++;notify('คู่หูเลเวล '+p.petLevel)}
else if(a==='mount'){if(!p.mount){if(!spend(200))return;p.mount=true}else p.mount=false;notify(p.mount?'ขึ้นสัตว์ขี่แล้ว':'ลงจากสัตว์ขี่')}
else if(a==='storyNext'){const req=[true,p.kills>=5,p.ore>=3,p.level>=4];if(!need(req[p.questStory]??false,'ยังไม่ผ่านเงื่อนไขเนื้อเรื่อง'))return;if(p.questStory>=4)return;p.questStory++;p.gold+=100;p.reputation+=10;p.gems+=15;notify('เนื้อเรื่องคืบหน้า +100G +15💎')}
else if(a==='arenaFight'){if(!need(p.hp>=25,'ต้องมี HP 25'))return;p.hp-=25;const win=Math.random()<Math.min(.95,.55+p.plus*.02+p.level*.01);if(win){p.arenaWins++;p.gold+=65;xpAdd(22);notify('ชนะนักสู้ NPC +65G')}else notify('แพ้การประลอง ฝึกใหม่ได้')}
else if(a==='weather'){const ws=['แจ่มใส','ฝนตก','หมอกลง','พายุ'];p.weather=ws[(ws.indexOf(p.weather)+1)%ws.length];p.day++;notify('อากาศ: '+p.weather)}
else if(a==='achieve'){for(const [id,ok,award] of [['นักล่าฝึกหัด',p.kills>=10,40],['ช่างฝีมือ',p.crafts>=3,50],['ผู้พิชิตดันเจี้ยน',p.dungeonWins>=1,100],['นักสำรวจ',p.level>=5,80]]){if(ok&&!p.achievements.includes(id)){p.achievements.push(id);p.titles.push(id);p.gems+=award;notify('🏅 ปลดล็อก '+id+' +'+award+'💎')}}}
else if(a==='elite'){if(!need(p.hp>=35,'HP ไม่พอ'))return;p.hp-=35;p.eliteWins++;p.gold+=90;p.stones+=2;xpAdd(30);notify('⚔️ ปราบ Elite +90G +2 หิน')}
else if(a.startsWith('travel')){const coords={traveltown:[300,280],travellake:[1100,520],travelforest:[2200,1700],travelgate:[2470,1600]};const [x,y]=coords[a];if(scene==='boss')leaveBoss();p.x=x;p.y=y;close();notify('เดินทางสำเร็จ')}
save();if(modal)render();});
// Weather overlay is cosmetic and does not interfere with controls.
const prevBackground=background;background=function(){prevBackground();if(p.weather==='ฝนตก'){ctx.save();ctx.strokeStyle='#9ec8ff55';for(let i=0;i<55;i++){const x=(i*79+tick*2)%innerWidth,y=(i*47+tick*5)%innerHeight;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+13);ctx.stroke()}ctx.restore()}else if(p.weather==='หมอกลง'){ctx.fillStyle='#dce5ff15';ctx.fillRect(0,0,innerWidth,innerHeight)}};
save();

})();
</script></body></html>
